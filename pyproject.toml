[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tallydesklet"
dynamic = ["version"]
description = "A compact GTK desktop system monitor for Linux"
requires-python = ">=3.10"
dependencies = ["psutil>=5.9"]

[project.scripts]
tallydesklet = "tallydesklet.app:main"

[tool.setuptools.dynamic]
version = {attr = "tallydesklet.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
